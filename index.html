function makeRng(seed) {
  let s = seed >>> 0;

    s = (s + 0x6D2B79F5) | 0;

    const factor = (0.24 + 0.27 * reveal) * depthLight;
    const r = Math.max(0, Math.min(255, Math.floor(base[0] * factor)));
    const g = Math.max(0, Math.min(255, Math.floor(base[1] * factor)));
    const b = Math.max(0, Math.min(255, Math.floor(base[2] * factor)));
    ctx.strokeStyle = "rgb(" + r + "," + g + "," + b + ")";
    ctx.beginPath();
    ctx.moveTo(X[s[0]], Y[s[0]]);
    for (let p = s[0] + 1; p < s[1]; p++) ctx.lineTo(X[p], Y[p]);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawParticles(angle, bloomT, elapsed) {
  ensureBuffers();
  accum.fill(0);
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tilt = 0.028 * Math.sin(angle);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const scale = Math.min(sceneW / 760.0, height / 720.0) * 1.06;
  const ox = sceneW * 0.52 + mouseParallax * 8.0;
  const oy = height * 0.59;

  const fx = data.final, st0 = data.start, an = data.anchor;
  const role = data.role, birth = data.birth, power = data.power, phase = data.phase;

  let growthSum = 0;
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    let g = (bloomT - birth[i]) / 1.05;
    if (g < 0) g = 0; else if (g > 1) g = 1;
    g = g * g * (3 - 2 * g);
    growthSum += g;
    let px = st0[i3] + (fx[i3] - st0[i3]) * g;
    let py = st0[i3 + 1] + (fx[i3 + 1] - st0[i3 + 1]) * g;
    let pz = st0[i3 + 2] + (fx[i3 + 2] - st0[i3 + 2]) * g;
    py += Math.sin(elapsed * 0.72 + phase[i]) * (0.75 * g);
    if (role[i] === PETAL) {
      const lx = px - an[i3], lz = pz - an[i3 + 2];
      px = an[i3] + lx * cosA - lz * sinA;
      pz = an[i3 + 2] + lx * sinA + lz * cosA;
    }
    px *= BOUQUET_SCALE; py *= BOUQUET_SCALE; pz *= BOUQUET_SCALE;
    const rx = px * cosA + pz * sinA;
    const rz = -px * sinA + pz * cosA;
    const ry = py * ct - rz * st;
    const rz2 = py * st + rz * ct;
    const persp = 1140.0 / (1140.0 - rz2);
    const sx = ox + rx * persp * scale;
    const sy = oy - ry * persp * scale;
    if (g > 0.002) {
      const ix = sx | 0, iy = sy | 0;
      if (ix >= 0 && ix < sceneW && iy >= 0 && iy < height) {
        let depthLight = 0.68 + (rz2 + 260.0) / 840.0;
        if (depthLight < 0.58) depthLight = 0.58; else if (depthLight > 1.18) depthLight = 1.18;
        const shimmer = 0.90 + 0.10 * Math.sin(elapsed * 1.25 + phase[i]);
        const intensity = power[i] * g * depthLight * shimmer;
        const base = (iy * sceneW + ix) * 3;
        accum[base] += colors[i3] * intensity;
        accum[base + 1] += colors[i3 + 1] * intensity;
        accum[base + 2] += colors[i3 + 2] * intensity;
      }
    }
  }

  const total = sceneW * height;
  let a = 0, p = 0;
  for (let i = 0; i < total; i++) {
    pixels[p] = accum[a] * 0.72;
    pixels[p + 1] = accum[a + 1] * 0.72;
    pixels[p + 2] = accum[a + 2] * 0.72;
    pixels[p + 3] = 255;
    a += 3; p += 4;
  }
  offCtx.putImageData(imageData, 0, 0);

  ctx.globalCompositeOperation = "lighter";
  halfCtx.clearRect(0, 0, half.width, half.height);
  halfCtx.drawImage(off, 0, 0, half.width, half.height);
  quarterCtx.clearRect(0, 0, quarter.width, quarter.height);
  quarterCtx.drawImage(half, 0, 0, quarter.width, quarter.height);
  ctx.globalAlpha = 0.36;
  ctx.drawImage(quarter, left, 0, sceneW, height);
  ctx.globalAlpha = 0.58;
  ctx.drawImage(half, left, 0, sceneW, height);
  ctx.globalAlpha = 1.0;
  ctx.drawImage(off, left, 0);
  ctx.globalAlpha = 0.18;
  ctx.drawImage(off, left + 1, 0);
  ctx.drawImage(off, left - 1, 0);
  ctx.drawImage(off, left, 1);
  ctx.drawImage(off, left, -1);
  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = "source-over";

  drawSparkles(angle, bloomT, elapsed);
  return growthSum / count * 100.0;
}
function drawSparkles(angle, bloomT, elapsed) {
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tilt = 0.028 * Math.sin(angle);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const scale = Math.min(sceneW / 760.0, height / 720.0) * 1.06;
  const ox = sceneW * 0.52 + mouseParallax * 8.0;
  const oy = height * 0.59;
  const fx = data.final, st0 = data.start, an = data.anchor;
  const role = data.role, birth = data.birth, size = data.size, phase = data.phase;
  let activeCount = 0;
  ctx.lineWidth = 1;
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    let g = (bloomT - birth[i]) / 1.05;
    if (g < 0) g = 0; else if (g > 1) g = 1;
    g = g * g * (3 - 2 * g);
    if (g <= 0.002) continue;
    if (activeCount % 53 === 0 && size[i] >= 1.9) {
      const pulse = Math.sin(elapsed * 2.1 + phase[i]);
      if (pulse >= 0.34) {
        let px = st0[i3] + (fx[i3] - st0[i3]) * g;
        let py = st0[i3 + 1] + (fx[i3 + 1] - st0[i3 + 1]) * g;
        let pz = st0[i3 + 2] + (fx[i3 + 2] - st0[i3 + 2]) * g;
        py += Math.sin(elapsed * 0.72 + phase[i]) * (0.75 * g);
        if (role[i] === PETAL) {
          const lx = px - an[i3], lz = pz - an[i3 + 2];
          px = an[i3] + lx * cosA - lz * sinA;
          pz = an[i3 + 2] + lx * sinA + lz * cosA;
        }
        px *= BOUQUET_SCALE; py *= BOUQUET_SCALE; pz *= BOUQUET_SCALE;
        const rx = px * cosA + pz * sinA;
        const rz = -px * sinA + pz * cosA;
        const ry = py * ct - rz * st;
        const rz2 = py * st + rz * ct;
        const persp = 1140.0 / (1140.0 - rz2);
        const sx = left + ox + rx * persp * scale;
        const sy = oy - ry * persp * scale;
        const radius = 2 + Math.floor(size[i] * 0.65);
        let cr, cg, cb;
        if (i % 5 === 0) { cr = 255; cg = 224; cb = 174; }
        else { cr = Math.min(255, colors[i3] * 1.12) | 0; cg = Math.min(255, colors[i3 + 1] * 1.12) | 0; cb = Math.min(255, colors[i3 + 2] * 1.12) | 0; }
        ctx.strokeStyle = "rgb(" + cr + "," + cg + "," + cb + ")";
        ctx.beginPath();
        ctx.moveTo(sx - radius * 2, sy); ctx.lineTo(sx + radius * 2, sy);
        ctx.moveTo(sx, sy - radius * 2); ctx.lineTo(sx, sy + radius * 2);
        ctx.stroke();
        ctx.fillStyle = "rgb(255,250,249)";
        ctx.fillRect(sx, sy, 1, 1);
      }
    }
    activeCount++;
  }
}

function drawLabels(bloomPercent, elapsed) {
  ctx.textBaseline = "top";
  ctx.font = fontLabel;
  if (bloomPercent < 99.2) {
    const statusText = "GENERATING ROSES  " + bloomPercent.toFixed(1).padStart(5, "0") + "%";
    ctx.fillStyle = "rgb(255,154,190)";
    ctx.fillText(statusText, width - ctx.measureText(statusText).width - 28, 28);
    const barW = Math.min(245, Math.floor(sceneW * 0.32));
    const barX = width - barW - 30, barY = 56;
    ctx.fillStyle = "rgb(42,30,45)";
    ctx.fillRect(barX, barY, barW, 2);
    ctx.fillStyle = "rgb(245,112,161)";
    ctx.fillRect(barX, barY, Math.floor(barW * Math.min(1.0, bloomPercent / 100.0)), 2);
  }
  ctx.font = fontLabel;
  const forever = "∞  FOR YOU, ALWAYS";
  ctx.fillStyle = "rgb(216,190,207)";
  ctx.fillText(forever, left + Math.floor(sceneW / 2) - Math.floor(ctx.measureText(forever).width / 2), height - 43);
  ctx.font = fontSmall;
  const helpText = "空格换色  ·  R 重新盛放  ·  F11 全屏  ·  Esc 退出";
  ctx.fillStyle = "rgb(91,83,104)";
  ctx.fillText(helpText, width - ctx.measureText(helpText).width - 22, height - 23);
  ctx.fillStyle = "rgb(119,105,124)";
  ctx.fillText(palette.name, left + 28, height - 23);
}

function burst(x, y) {
  const pal = palette.petal;
  for (let index = 0; index < 38; index++) {
    const angle = TAU * index / 38 + rng.uniform(-0.12, 0.12);
    const speed = rng.uniform(55.0, 165.0);
    sparks.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rng.uniform(0.8, 1.5),
      color: pal[index % 3]
    });
  }
}

function drawClickSparks(delta) {
  ctx.globalCompositeOperation = "source-over";
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= delta;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    s.x += s.vx * delta;
    s.y += s.vy * delta;
    s.vx *= 0.98;
    s.vy = s.vy * 0.98 + 32.0 * delta;
    const fade = Math.min(1.0, s.life);
    ctx.fillStyle = "rgb(" + (s.color[0] * fade | 0) + "," + (s.color[1] * fade | 0) + "," + (s.color[2] * fade | 0) + ")";
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2, 0, TAU);
    ctx.fill();
  }
}

let lastFrame = performance.now() / 1000;

function frame(nowMs) {
  const now = nowMs / 1000;
  const delta = Math.min(0.05, now - lastFrame);
  lastFrame = now;
  if (window.innerWidth !== width || window.innerHeight !== height) resize();
  const elapsed = now - started;
  const bloomT = now - bloomStarted;
  mouseParallax += (targetParallax - mouseParallax) * 0.045;
  const angle = (elapsed * TAU / 36.0) % TAU + mouseParallax * 0.055;

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  drawBackground(elapsed);
  drawCodePanel(elapsed);
  drawSpaceBox(angle, elapsed);
  drawOutlines(angle, bloomT, elapsed);
  const bloomPercent = drawParticles(angle, bloomT, elapsed);
  drawClickSparks(delta);
  drawLabels(bloomPercent, elapsed);

  requestAnimationFrame(frame);
}

window.addEventListener("keydown", function (e) {
  if (e.key === " " || e.code === "Space") {
    setPalette(paletteIndex + 1);
    e.preventDefault();
  } else if (e.key === "r" || e.key === "R") {
    bloomStarted = performance.now() / 1000;
  } else if (e.key === "F11") {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    e.preventDefault();
  }
});

window.addEventListener("mousemove", function (e) {
  targetParallax = (e.clientX / Math.max(1, width) - 0.5) * 2.0;
});

canvas.addEventListener("mousedown", function (e) {
  if (e.button === 0) burst(e.clientX, e.clientY);
});

window.addEventListener("resize", resize);

resize();
setPalette(0);
requestAnimationFrame(frame);
</script>
</body>
