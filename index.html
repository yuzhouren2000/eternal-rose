"use strict";

/* ==========================================================================
   rose.js —— 玩家在编辑器里看到、修改的就是这一段。

const ROSE_MODULE_BUGGY = `
const TAU = Math.PI * 2;

// 一、衬底：叶子、满天星、包装纸
function buildFoliage(builder) {
  builder.addLeaves(30);
  builder.addFoliageCloud(3000);
  builder.addBabyBreath(64);
  builder.addWrapper();
}

// 二、每一层花瓣的数量：越靠外越多
function petalCountOf(layer) {
  3 + layer * 2;
}

// 三、26 个花心：沿一条黄金角螺旋线分布
function makeRoseCenters(count, rng) {
  const centers = [];
  const goldenAngle =
    Math.PI * (3.0 - Math.sqrt(4.0));
  for (let index = 0; index < centers.length; index++) {
    const progress = (index + 0.45) / count;
    const y = 304.0 - progress * 302.0 + rng.uniform(-9.0, 9.0);
    const normalizedY = (y - 153.0) / 166.0;
    const ring = 246.0 * Math.sqrt(
      Math.max(0.13, 1.0 - normalizedY * normalizedY));
    const angle = index * goldenAngle + 0.38;
    const radius = rng.uniform(7.4, 8.9)
      + (1.0 - Math.abs(normalizedY)) * 5.0;
    centers.push([
      Math.cos(angle) * ring, y, Math.sin(angle) * ring, radius]);
  }
  return centers;
}

// 四、把整束花搭起来（builder 由引擎提供）
function buildBouquet(builder) {
  const rng = makeRng(20260812);
  const centers = makeRoseCenters(26, rng);
  const buds = [
    [292, 91, 0], [230, 102, 12], [166, 111, -8],
    [98, 108, 10], [30, 99, -6]
  ];
  for (const b of buds) centers.push([0, b[0], b[2], b[1]]);
  let index = 0;
  for (const c of centers) {
    builder.addStem(c);
    builder.addRose(c, c[3], index);
    index++;
  }
  // TODO: 衬底先不画了
  // buildFoliage(builder);
  return centers;
}

// 五、一直开下去（bouquet / ctx / requestAnimationFrame 由引擎提供）
function bloomForever() {
  const now = performance.now() / 1000;
  const angle = (now * TAU / 36.0) % TAU;
  bouquet.render(ctx, angle);
  requestAnimationFrame(bloomForever());
}
`.trim();

/* ── CONFIG ──────────────────────────────────────────────────
   想加"小巧思"（通关彩蛋、她的名字、git commit 彩蛋……）改这里就行，
   不用动引擎。比如给 successExtra 填一句话，通关时控制台会多打一行。 */
const CONFIG = {
  // 全部测试通过时，控制台最后一行
  successLine: "→ 玫瑰盛开",
  // 通关时额外打印的一行（null = 不打印）。例："$ git commit -m \"fix: 修好了这朵花\""
  successExtra: null
};

/* 引擎真正使用的规则。玩家代码编译成功后，这里会被换成玩家的函数。 */
function defaultPetalCountOf(layer) { return 3 + layer * 2; }

function defaultMakeRoseCenters(count, rng) {
  const centers = [];
  const goldenAngle = Math.PI * (3.0 - Math.sqrt(5.0));
  for (let index = 0; index < count; index++) {
    const progress = (index + 0.45) / count;
    const y = 304.0 - progress * 302.0 + rng.uniform(-9.0, 9.0);
    const normalizedY = (y - 153.0) / 166.0;
    const ring = 246.0 * Math.sqrt(Math.max(0.13, 1.0 - normalizedY * normalizedY));
    const angle = index * goldenAngle + 0.38;
    const x = Math.cos(angle) * ring;
    const z = Math.sin(angle) * ring;
    const radius = rng.uniform(74.0, 89.0) + (1.0 - Math.abs(normalizedY)) * 5.0;
    centers.push([x, y, z, radius]);
  }
  return centers;
}

function defaultBuildFoliage(builder) {
  builder.addLeaves(30);
  builder.addFoliageCloud(3000);
  builder.addBabyBreath(64);
  builder.addWrapper();
}

function defaultBuildBouquet(builder) {
  const rng = makeRng(20260812);
  const centers = defaultMakeRoseCenters(26, rng);
  const buds = [[292.0, 91.0, 0.0], [230.0, 102.0, 12.0], [166.0, 111.0, -8.0], [98.0, 108.0, 10.0], [30.0, 99.0, -6.0]];
  for (const b of buds) centers.push([0.0, b[0], b[2], b[1]]);
  for (let index = 0; index < centers.length; index++) {
    const c = centers[index];
    builder.addStem(c, index);
    builder.addRose(c, c[3], index);
  }
  defaultBuildFoliage(builder);
  return centers;
}

const RULES = {
  petalCountOf: defaultPetalCountOf,
  makeRoseCenters: defaultMakeRoseCenters,
  buildBouquet: defaultBuildBouquet,
  continuous: true
};

/* 玩家的值直接进渲染，所以只做防止卡死的钳制，不做"纠正"：
   undefined / NaN 会老老实实变成 0 片花瓣。 */
function clampCount(value) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n)) return 0;
  if (n < 0) return 0;
  if (n > 12) return 12;
  return n;
}

function petalCountFor(layer) {
  const fn = RULES.petalCountOf;
  if (typeof fn !== "function") return 0;
  try { return clampCount(fn(layer)); } catch (err) { return 0; }
}

const TAU = Math.PI * 2;
const BOUQUET_SCALE = 0.925;

const PETAL = 0, LEAF = 1, STEM = 2, BABY = 3, WRAP = 4, RIBBON = 5, BUNDLE = 6;
const ROLE_KEY = { 1: "leaf", 2: "stem", 3: "baby", 4: "wrap", 5: "ribbon", 6: "bundle" };

const PALETTES = [
  {

    petal: [[238, 55, 98], [255, 133, 164], [255, 238, 240]],
    leaf: [[63, 82, 74], [209, 219, 210]],

  {

    stem: [[49, 67, 45], [133, 148, 106]],
    baby: [[255, 244, 211], [255, 210, 153]],

  },
  {

    petal: [[112, 55, 162], [194, 138, 232], [248, 232, 255]],
    leaf: [[59, 78, 82], [194, 211, 214]],
    stem: [[43, 67, 68], [121, 151, 151]],
    baby: [[244, 243, 255], [215, 220, 255]],
    wrap: [[39, 18, 57], [118, 57, 136]],
    ribbon: [[211, 201, 230], [253, 248, 255]],
    bundle: [[55, 27, 75], [143, 70, 130]]
  }
];

const CODE_TEXT = `
<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Eternal Rose Code</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #04050b;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script>
    "use strict";

    const TAU = Math.PI * 2;
    const BOUQUET_SCALE = 0.925;
    const PETAL = 0, LEAF = 1, STEM = 2;
    const BABY = 3, WRAP = 4, RIBBON = 5;

    function makeRng(seed) {
      let s = seed >>> 0;
      return function () {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    class Builder {
      constructor(seed) {
        this.rng = makeRng(seed);
        this.petals = [];
      }

      addRose(center, radius, index) {
        const cx = center[0];
        const cy = center[1];
        const cz = center[2];
        for (let layer = 0; layer < 5; layer++) {
          const petalCount = 3 + layer * 2;
          for (let petal = 0; petal < petalCount; petal++) {
            let angle = TAU * petal / petalCount;
            angle += layer * 0.73;
            const ring = radius * (0.04 + layer * 0.085);
            const length = radius * (0.22 + layer * 0.035);
            const width = radius * (0.10 + layer * 0.017);
            const twist = 0.48 - layer * 0.052;
            this.petals.push({
              angle: angle,
              ring: ring,
              length: length,
              width: width,
              twist: twist
            });
          }
        }
      }
    }

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    function project(x, y, z, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const rx = x * cos + z * sin;
      const rz = -x * sin + z * cos;
      const persp = 1140 / (1140 - rz);
      return [rx * persp, y * persp];
    }

    function bloomForever() {
      const bouquet = new Builder(20260811);
      const now = performance.now() / 1000;
      const angle = (now * TAU / 36) % TAU;
      bouquet.render(ctx, angle);
      requestAnimationFrame(bloomForever);
    }
    bloomForever();

    // The bouquet does not restart.

const KEYWORD_RE = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(<\/?[a-zA-Z][\w-]*)|([a-zA-Z_][\w-]*(?=\s*=))|(\b(?:const|let|var|function|class|return|new|for|of|in|while|if|else|this|true|false|null|undefined|typeof|document|window|Math|performance|requestAnimationFrame)\b)|(\b0x[0-9A-Fa-f]+\b|\b\d+(?:\.\d+)?\b)|([{}()\[\];,.<>=+\-\/*|&!?:])/g;

function makeRng(seed) {
  let s = seed >>> 0;
  function next() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    random: next,
    uniform: (a, b) => a + (b - a) * next(),
    choice: (arr) => arr[Math.floor(next() * arr.length)],
    gauss: (mu, sigma) => {
      let u = 0, v = 0;
      while (u === 0) u = next();
      while (v === 0) v = next();
      return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
    }
  };
}
class Builder {
  constructor(seed) {
    this.rng = makeRng(seed);
    this.fx = []; this.fy = []; this.fz = [];
    this.sx = []; this.sy = []; this.sz = [];
    this.ax = []; this.ay = []; this.az = [];
    this.role = []; this.tone = []; this.birth = [];
    this.power = []; this.size = []; this.phase = [];
  }

  add(f, st, role, tone, birth, power, size, anchor) {
    if (power === undefined) power = 1.0;
    if (size === undefined) size = 1.0;
    const a = anchor || [0, 0, 0];
    this.fx.push(f[0]); this.fy.push(f[1]); this.fz.push(f[2]);
    this.sx.push(st[0]); this.sy.push(st[1]); this.sz.push(st[2]);
    this.ax.push(a[0]); this.ay.push(a[1]); this.az.push(a[2]);
    this.role.push(role);
    this.tone.push(Math.max(0, Math.min(1, tone)));
    this.birth.push(birth);
    this.power.push(power);
    this.size.push(size);
    this.phase.push(this.rng.random() * TAU);
  }

  addRose(center, radius, bloomIndex) {
    const cx = center[0], cy = center[1], cz = center[2];
    const rng = this.rng;
    for (let layer = 0; layer < 5; layer++) {
      const petalCount = petalCountFor(layer);
      for (let petal = 0; petal < petalCount; petal++) {
        let angle = TAU * petal / petalCount + layer * 0.73;
        angle += rng.uniform(-0.035, 0.035);
        for (let iu = 0; iu < 4; iu++) {
          const u = (iu + 0.35 + rng.random() * 0.3) / 4.0;
          const v0s = [-1.0, -0.34, 0.34, 1.0];
          for (let vi = 0; vi < 4; vi++) {
            const v0 = v0s[vi];
            const v = v0 + rng.uniform(-0.045, 0.045);
            const ring = radius * (0.04 + layer * 0.085);
            const length = radius * (0.22 + layer * 0.035);
            const radial = ring + length * u;
            const twist = (0.48 - layer * 0.052) * (1.0 - u);
            const theta = angle + twist;
            let width = radius * (0.10 + layer * 0.017);
            width *= Math.pow(Math.max(0.05, Math.sin(Math.PI * u)), 0.75);
            const across = v * width;
            let localX = radial * Math.cos(theta) - across * Math.sin(theta);
            let localY = (radial * Math.sin(theta) + across * Math.cos(theta)) * 0.92;
            let localZ = radius * (0.49 - layer * 0.06) * (1.0 - u);
            localZ += radius * (0.078 + layer * 0.006) * (1.0 - v * v) * Math.sin(Math.PI * u);
            localZ -= layer * radius * 0.024;
            localX += rng.uniform(-1.2, 1.2);
            localY += rng.uniform(-1.2, 1.2);
            localZ += rng.uniform(-0.8, 0.8);

            const final = [cx + localX, cy + localY, cz + localZ];
            const unfurl = 0.055 + layer * 0.018;
            const start = [cx + localX * unfurl, cy + localY * unfurl, cz + localZ * 0.08];
            const isEdge = Math.abs(v0) > 0.8;
            const edgeLight = isEdge ? 0.43 : 0.0;
            const tone = 0.05 + layer * 0.075 + u * 0.24 + edgeLight;
            let birth = 1.15 + bloomIndex * 0.34 + layer * 0.23 + u * 0.12;
            birth += rng.uniform(0.0, 0.18);
            const power = (isEdge ? 1.08 : 0.23) + rng.uniform(0.0, 0.11);
            const size = (isEdge ? 2.6 : 0.72) + rng.random() * 0.48;
            this.add(final, start, PETAL, tone, birth, power, size, [cx, cy, cz]);
          }
        }
      }
    }

    for (let si = 0; si < 116; si++) {
      const t = si / 115.0;
      const angle = t * TAU * 2.35 + 0.55;
      const radial = radius * (0.025 + 0.285 * t);
      const localX = Math.cos(angle) * radial;
      const localY = Math.sin(angle) * radial * 0.88;
      const localZ = radius * (0.46 - 0.22 * t) + Math.sin(t * Math.PI * 5.0) * 1.5;
      const final = [cx + localX, cy + localY, cz + localZ];
      const start = [cx + localX * 0.04, cy + localY * 0.04, cz];
      const birth = 0.95 + bloomIndex * 0.34 + t * 0.44;
      this.add(final, start, PETAL, 0.06 + t * 0.26, birth, 1.14, 2.7, [cx, cy, cz]);
    }

    for (let k = 0; k < 96; k++) {
      const angle = rng.random() * TAU;
      const radial = radius * rng.uniform(0.62, 1.05);
      const localX = Math.cos(angle) * radial;
      const localY = Math.sin(angle) * radial * 0.86;
      const localZ = rng.uniform(-radius * 0.12, radius * 0.34);
      const final = [cx + localX, cy + localY, cz + localZ];
      const start = [cx + localX * 0.12, cy + localY * 0.12, cz];
      const birth = 2.0 + bloomIndex * 0.34 + rng.uniform(0.0, 1.3);
      this.add(final, start, PETAL, rng.uniform(0.68, 1.0), birth, 0.145, 0.55, [cx, cy, cz]);
    }

  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  width = w; height = h;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  showCode = false;   // 代码面板由真实的 DOM 编辑器接管，canvas 只负责玫瑰
  left = Math.max(1, Math.round(workEl.getBoundingClientRect().width));
  sceneW = Math.max(1, w - left);
  const scale = Math.max(0.82, Math.min(1.35, h / 720.0));
  codeFontPx = Math.max(12, Math.round(14 * scale));
  const smallPx = Math.max(11, Math.round(12 * scale));
  const labelPx = Math.max(13, Math.round(15 * scale));
  fontSmall = smallPx + "px " + UI_FONT;
  fontLabel = "bold " + labelPx + "px " + UI_FONT;
  ensureBuffers();
}

const CODE_FONT = 'Consolas, "Cascadia Mono", "Courier New", monospace';
const UI_FONT = '"Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif';

function projectPoint(px, py, pz, cosA, sinA, ct, st, scale, ox, oy) {
  const x = px * cosA + pz * sinA;
  const z = -px * sinA + pz * cosA;
  const y = py * ct - z * st;
  const z2 = py * st + z * ct;
  const persp = 1140.0 / (1140.0 - z2);
  return [ox + x * persp * scale, oy - y * persp * scale, persp, z2];
}

function drawBackground(elapsed) {
  ctx.fillStyle = "rgb(4,5,11)";
  ctx.fillRect(0, 0, width, height);
  for (let index = 0; index < 36; index++) {
    const t = index / 35.0;
    const r = Math.floor(5 + 7 * t);
    const g = Math.floor(6 + 3 * t);
    const b = Math.floor(14 + 8 * (1.0 - Math.abs(t - 0.5)));
    ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
    const y0 = Math.floor(height * index / 36);
    const y1 = Math.floor(height * (index + 1) / 36) + 1;
    ctx.fillRect(left, y0, sceneW, y1 - y0);
  }
  ctx.fillStyle = "rgb(5,6,12)";
  ctx.fillRect(0, 0, left, height);
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < starField.length; i++) {
    const s = starField[i];
    const pulse = 0.45 + 0.55 * Math.pow(Math.sin(elapsed * 0.75 + s[3]), 2);
    const color = Math.floor(72 + pulse * 100);
    const x = left + s[0] * sceneW;
    const y = s[1] * height;
    const radius = s[2] * pulse < 1.25 ? 1 : 2;
    ctx.fillStyle = "rgb(" + color + "," + (color - 5) + "," + Math.min(255, color + 18) + ")";
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, TAU);
    ctx.fill();
  }
  if (ambient) ctx.drawImage(ambient, left, 0);
  ctx.globalCompositeOperation = "source-over";
}

function drawCodePanel(elapsed) {
  if (!showCode) return;
  const headerH = 58;
  const lineH = codeLineH;
  const totalH = codeLines.length * lineH;
  const offset = (elapsed * 30.0) % totalH;

  ctx.fillStyle = "rgb(10,11,20)";
  ctx.fillRect(0, 0, left, headerH);
  ctx.strokeStyle = "rgb(35,36,52)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, headerH + 0.5); ctx.lineTo(left, headerH + 0.5); ctx.stroke();
  const dots = ["rgb(255,95,106)", "rgb(255,193,75)", "rgb(67,202,115)"];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = dots[i];
    ctx.beginPath(); ctx.arc(21 + i * 21, 20, 5, 0, TAU); ctx.fill();
  }
  ctx.font = fontLabel;
  ctx.fillStyle = "rgb(214,216,228)";
  ctx.textBaseline = "top";
  ctx.fillText("index.html", 82, 10);
  ctx.font = fontSmall;
  const runText = "●  RUNNING  ∞";
  ctx.fillStyle = "rgb(104,216,159)";
  ctx.fillText(runText, left - ctx.measureText(runText).width - 18, 13);
  ctx.fillStyle = "rgb(84,87,108)";
  ctx.fillText("SINGLE FILE  /  CANVAS PARTICLE ENGINE", 82, 34);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, headerH + 1, left, height - headerH - 1);
  ctx.clip();
  const visibleFocus = Math.floor(headerH + height * 0.49);
  ctx.fillStyle = "rgb(12,15,27)";
  ctx.fillRect(0, visibleFocus, left, lineH);
  ctx.fillStyle = "rgb(169,71,121)";
  ctx.fillRect(0, visibleFocus, 2, lineH);

  for (let repeat = 0; repeat < 2; repeat++) {
    const baseY = headerH + 8 - offset + repeat * totalH;
    for (let index = 0; index < codeLines.length; index++) {
      const y = Math.floor(baseY + index * lineH);
      if (y < headerH - lineH || y > height) continue;
      ctx.font = codeFontPx + "px " + CODE_FONT;
      ctx.fillStyle = "rgb(58,61,78)";
      const num = ("   " + (index + 1)).slice(-3);
      ctx.fillText(num, 9, y);
      const line = CODE_TEXT[index];
      let leading = 0;
      while (leading < line.length && line[leading] === " ") leading++;
      const guideW = ctx.measureText("    ").width;
      ctx.strokeStyle = "rgb(28,31,45)";
      ctx.beginPath();
      for (let guide = 1; guide <= Math.floor(leading / 4); guide++) {
        const gx = Math.floor(48 + guide * guideW) + 0.5;
        ctx.moveTo(gx, y); ctx.lineTo(gx, y + lineH);
      }
      ctx.stroke();
      ctx.drawImage(codeLines[index], 48, y);
    }
  }
  if (Math.floor(elapsed * 2) % 2 === 0) {
    ctx.fillStyle = "rgb(235,137,183)";
    ctx.fillRect(left - 13, visibleFocus + 3, 2, lineH - 6);
  }
  ctx.restore();
  ctx.strokeStyle = "rgb(104,93,122)";
  ctx.beginPath(); ctx.moveTo(left + 0.5, 0); ctx.lineTo(left + 0.5, height); ctx.stroke();
  ctx.strokeStyle = "rgb(34,32,49)";
  ctx.beginPath(); ctx.moveTo(left + 3.5, 0); ctx.lineTo(left + 3.5, height); ctx.stroke();
}
function drawSpaceBox(angle, elapsed) {
  const corners = [
    [-365, -285, 250], [365, -285, 250], [-365, 400, 250], [365, 400, 250],
    [-365, -285, -250], [365, -285, -250], [-365, 400, -250], [365, 400, -250]
  ];
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tilt = 0.028 * Math.sin(angle);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const scale = Math.min(sceneW / 760.0, height / 720.0) * 1.06;
  const ox = sceneW * 0.52 + mouseParallax * 8.0;
  const oy = height * 0.59;
  const px = [], py = [], depth = [];
  for (let i = 0; i < corners.length; i++) {
    const r = projectPoint(corners[i][0], corners[i][1], corners[i][2], cosA, sinA, ct, st, scale, ox, oy);
    px.push(left + r[0]); py.push(r[1]); depth.push(r[3]);
  }
  const edges = [[0, 1], [1, 3], [3, 2], [2, 0], [4, 5], [5, 7], [7, 6], [6, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
  ctx.globalCompositeOperation = "lighter";
  for (const e of edges) {
    const a = e[0], b = e[1];
    const near = (depth[a] + depth[b]) * 0.5;
    const light = Math.floor(90 + Math.max(-270, Math.min(270, near)) / 270 * 32);
    const color = "rgb(" + light + "," + Math.max(0, light - 3) + "," + Math.min(255, light + 16) + ")";
    const halo = "rgb(" + Math.floor(light / 4) + "," + Math.floor(Math.max(0, light - 3) / 4) + "," + Math.floor(Math.min(255, light + 16) / 4) + ")";
    ctx.strokeStyle = halo;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px[a], py[a]); ctx.lineTo(px[b], py[b]); ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px[a], py[a]); ctx.lineTo(px[b], py[b]); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}

let outX = null, outY = null, outD = null;

function drawOutlines(angle, bloomT, elapsed) {
  const pts = outline.points;
  const anc = outline.anchors;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tilt = 0.028 * Math.sin(angle);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const scale = Math.min(sceneW / 760.0, height / 720.0) * 1.06;
  const ox = sceneW * 0.52 + mouseParallax * 8.0;
  const oy = height * 0.59;
  const n = pts.length;
  if (outX === null || outX.length !== n) {
    outX = new Float32Array(n); outY = new Float32Array(n); outD = new Float32Array(n);
  }
  const X = outX, Y = outY, D = outD;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = anc[i];
    let lx = p[0] - a[0], lz = p[2] - a[2];
    let wx = a[0] + lx * cosA - lz * sinA;
    let wz = a[2] + lx * sinA + lz * cosA;
    let wy = p[1];
    wx *= BOUQUET_SCALE; wy *= BOUQUET_SCALE; wz *= BOUQUET_SCALE;
    const r = projectPoint(wx, wy, wz, cosA, sinA, ct, st, scale, ox, oy);
    X[i] = left + r[0]; Y[i] = r[1]; D[i] = r[3];
  }
  const dark = palette.petal[0], middle = palette.petal[1], light = palette.petal[2];
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 1;
  for (let index = 0; index < outline.slices.length; index++) {
    const reveal = Math.max(0.0, Math.min(1.0, (bloomT - outline.births[index]) / 0.9));
    if (reveal <= 0.0) continue;
    const tone = outline.tones[index];
    let base;
    if (tone < 0.52) {
      const tt = tone / 0.52;
      base = [dark[0] + (middle[0] - dark[0]) * tt, dark[1] + (middle[1] - dark[1]) * tt, dark[2] + (middle[2] - dark[2]) * tt];
    } else {
      const tt = (tone - 0.52) / 0.48;
      base = [middle[0] + (light[0] - middle[0]) * tt, middle[1] + (light[1] - middle[1]) * tt, middle[2] + (light[2] - middle[2]) * tt];
    }
    const s = outline.slices[index];
    let dsum = 0;
    for (let p = s[0]; p < s[1]; p++) dsum += D[p];
    const depthLight = Math.max(0.66, Math.min(1.05, 0.82 + (dsum / (s[1] - s[0])) / 900.0));
    const factor = (0.24 + 0.27 * reveal) * depthLight;
    const r = Math.max(0, Math.min(255, Math.floor(base[0] * factor)));
    const g = Math.max(0, Math.min(255, Math.floor(base[1] * factor)));
    const b = Math.max(0, Math.min(255, Math.floor(base[2] * factor)));
    ctx.strokeStyle = "rgb(" + r + "," + g + "," + b + ")";
    ctx.beginPath();
    ctx.moveTo(X[s[0]], Y[s[0]]);
    for (let p = s[0] + 1; p < s[1]; p++) ctx.lineTo(X[p], Y[p]);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawParticles(angle, bloomT, elapsed) {
  ensureBuffers();
  accum.fill(0);
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tilt = 0.028 * Math.sin(angle);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const scale = Math.min(sceneW / 760.0, height / 720.0) * 1.06;
  const ox = sceneW * 0.52 + mouseParallax * 8.0;
  const oy = height * 0.59;

  const fx = data.final, st0 = data.start, an = data.anchor;
  const role = data.role, birth = data.birth, power = data.power, phase = data.phase;

  let growthSum = 0;
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    let g = (bloomT - birth[i]) / 1.05;
    if (g < 0) g = 0; else if (g > 1) g = 1;
    g = g * g * (3 - 2 * g);
    growthSum += g;
    let px = st0[i3] + (fx[i3] - st0[i3]) * g;
    let py = st0[i3 + 1] + (fx[i3 + 1] - st0[i3 + 1]) * g;
    let pz = st0[i3 + 2] + (fx[i3 + 2] - st0[i3 + 2]) * g;
    py += Math.sin(elapsed * 0.72 + phase[i]) * (0.75 * g);
    if (role[i] === PETAL) {
      const lx = px - an[i3], lz = pz - an[i3 + 2];
      px = an[i3] + lx * cosA - lz * sinA;
      pz = an[i3 + 2] + lx * sinA + lz * cosA;
    }
    px *= BOUQUET_SCALE; py *= BOUQUET_SCALE; pz *= BOUQUET_SCALE;
    const rx = px * cosA + pz * sinA;
    const rz = -px * sinA + pz * cosA;
    const ry = py * ct - rz * st;
    const rz2 = py * st + rz * ct;
    const persp = 1140.0 / (1140.0 - rz2);
    const sx = ox + rx * persp * scale;
    const sy = oy - ry * persp * scale;
    if (g > 0.002 && sx === sx && sy === sy) {
      const ix = sx | 0, iy = sy | 0;
      if (ix >= 0 && ix < sceneW && iy >= 0 && iy < height) {
        let depthLight = 0.68 + (rz2 + 260.0) / 840.0;
        if (depthLight < 0.58) depthLight = 0.58; else if (depthLight > 1.18) depthLight = 1.18;
        const shimmer = 0.90 + 0.10 * Math.sin(elapsed * 1.25 + phase[i]);
        const intensity = power[i] * g * depthLight * shimmer;
        const base = (iy * sceneW + ix) * 3;
        accum[base] += colors[i3] * intensity;
        accum[base + 1] += colors[i3 + 1] * intensity;
        accum[base + 2] += colors[i3 + 2] * intensity;
      }
    }
  }

  const total = sceneW * height;
  let a = 0, p = 0;
  for (let i = 0; i < total; i++) {
    pixels[p] = accum[a] * 0.72;
    pixels[p + 1] = accum[a + 1] * 0.72;
    pixels[p + 2] = accum[a + 2] * 0.72;
    pixels[p + 3] = 255;
    a += 3; p += 4;
  }
  offCtx.putImageData(imageData, 0, 0);

  ctx.globalCompositeOperation = "lighter";
  halfCtx.clearRect(0, 0, half.width, half.height);
  halfCtx.drawImage(off, 0, 0, half.width, half.height);
  quarterCtx.clearRect(0, 0, quarter.width, quarter.height);
  quarterCtx.drawImage(half, 0, 0, quarter.width, quarter.height);
  ctx.globalAlpha = 0.36;
  ctx.drawImage(quarter, left, 0, sceneW, height);
  ctx.globalAlpha = 0.58;
  ctx.drawImage(half, left, 0, sceneW, height);
  ctx.globalAlpha = 1.0;
  ctx.drawImage(off, left, 0);
  ctx.globalAlpha = 0.18;
  ctx.drawImage(off, left + 1, 0);
  ctx.drawImage(off, left - 1, 0);
  ctx.drawImage(off, left, 1);
  ctx.drawImage(off, left, -1);
  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = "source-over";

  drawSparkles(angle, bloomT, elapsed);
  return growthSum / count * 100.0;
}
function drawSparkles(angle, bloomT, elapsed) {
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tilt = 0.028 * Math.sin(angle);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const scale = Math.min(sceneW / 760.0, height / 720.0) * 1.06;
  const ox = sceneW * 0.52 + mouseParallax * 8.0;
  const oy = height * 0.59;
  const fx = data.final, st0 = data.start, an = data.anchor;
  const role = data.role, birth = data.birth, size = data.size, phase = data.phase;
  let activeCount = 0;
  ctx.lineWidth = 1;
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    let g = (bloomT - birth[i]) / 1.05;
    if (g < 0) g = 0; else if (g > 1) g = 1;
    g = g * g * (3 - 2 * g);
    if (g <= 0.002) continue;
    if (activeCount % 53 === 0 && size[i] >= 1.9) {
      const pulse = Math.sin(elapsed * 2.1 + phase[i]);
      if (pulse >= 0.34) {
        let px = st0[i3] + (fx[i3] - st0[i3]) * g;
        let py = st0[i3 + 1] + (fx[i3 + 1] - st0[i3 + 1]) * g;
        let pz = st0[i3 + 2] + (fx[i3 + 2] - st0[i3 + 2]) * g;
        py += Math.sin(elapsed * 0.72 + phase[i]) * (0.75 * g);
        if (role[i] === PETAL) {
          const lx = px - an[i3], lz = pz - an[i3 + 2];
          px = an[i3] + lx * cosA - lz * sinA;
          pz = an[i3 + 2] + lx * sinA + lz * cosA;
        }
        px *= BOUQUET_SCALE; py *= BOUQUET_SCALE; pz *= BOUQUET_SCALE;
        const rx = px * cosA + pz * sinA;
        const rz = -px * sinA + pz * cosA;
        const ry = py * ct - rz * st;
        const rz2 = py * st + rz * ct;
        const persp = 1140.0 / (1140.0 - rz2);
        const sx = left + ox + rx * persp * scale;
        const sy = oy - ry * persp * scale;
        const radius = 2 + Math.floor(size[i] * 0.65);
        let cr, cg, cb;
        if (i % 5 === 0) { cr = 255; cg = 224; cb = 174; }
        else { cr = Math.min(255, colors[i3] * 1.12) | 0; cg = Math.min(255, colors[i3 + 1] * 1.12) | 0; cb = Math.min(255, colors[i3 + 2] * 1.12) | 0; }
        ctx.strokeStyle = "rgb(" + cr + "," + cg + "," + cb + ")";
        ctx.beginPath();
        ctx.moveTo(sx - radius * 2, sy); ctx.lineTo(sx + radius * 2, sy);
        ctx.moveTo(sx, sy - radius * 2); ctx.lineTo(sx, sy + radius * 2);
        ctx.stroke();
        ctx.fillStyle = "rgb(255,250,249)";
        ctx.fillRect(sx, sy, 1, 1);
      }
    }
    activeCount++;
  }
}

function drawLabels(bloomPercent, elapsed) {
  if (!won) return;   // 编辑阶段保持干净，通关后才出现 HUD
  ctx.textBaseline = "top";
  ctx.font = fontLabel;
  if (bloomPercent < 99.2) {
    const statusText = "GENERATING ROSES  " + bloomPercent.toFixed(1).padStart(5, "0") + "%";
    ctx.fillStyle = "rgb(255,154,190)";
    ctx.fillText(statusText, width - ctx.measureText(statusText).width - 28, 28);
    const barW = Math.min(245, Math.floor(sceneW * 0.32));
    const barX = width - barW - 30, barY = 56;
    ctx.fillStyle = "rgb(42,30,45)";
    ctx.fillRect(barX, barY, barW, 2);
    ctx.fillStyle = "rgb(245,112,161)";
    ctx.fillRect(barX, barY, Math.floor(barW * Math.min(1.0, bloomPercent / 100.0)), 2);
  }
  ctx.font = fontLabel;
  const forever = "∞  FOR YOU, ALWAYS";
  ctx.fillStyle = "rgb(216,190,207)";
  ctx.fillText(forever, left + Math.floor(sceneW / 2) - Math.floor(ctx.measureText(forever).width / 2), height - 43);
  ctx.font = fontSmall;
  const helpText = IS_TOUCH ? "轻点撒花  ·  双切换色" : "空格换色  ·  R 重新盛放  ·  F11 全屏";
  ctx.fillStyle = "rgb(91,83,104)";
  ctx.fillText(helpText, width - ctx.measureText(helpText).width - 22, height - 23);
  ctx.fillStyle = "rgb(119,105,124)";
  ctx.fillText(palette.name, left + 28, height - 23);
}

function burst(x, y) {
  const pal = palette.petal;
  for (let index = 0; index < 38; index++) {
    const angle = TAU * index / 38 + rng.uniform(-0.12, 0.12);
    const speed = rng.uniform(55.0, 165.0);
    sparks.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rng.uniform(0.8, 1.5),
      color: pal[index % 3]
    });
  }
}

function drawClickSparks(delta) {
  ctx.globalCompositeOperation = "source-over";
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= delta;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    s.x += s.vx * delta;
    s.y += s.vy * delta;
    s.vx *= 0.98;
    s.vy = s.vy * 0.98 + 32.0 * delta;
    const fade = Math.min(1.0, s.life);
    ctx.fillStyle = "rgb(" + (s.color[0] * fade | 0) + "," + (s.color[1] * fade | 0) + "," + (s.color[2] * fade | 0) + ")";
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2, 0, TAU);
    ctx.fill();
  }
}

let lastFrame = performance.now() / 1000;

function frame(nowMs) {
  const now = nowMs / 1000;
  const delta = Math.min(0.05, now - lastFrame);
  lastFrame = now;
  if (window.innerWidth !== width || window.innerHeight !== height) resize();
  const elapsed = now - started;
  const bloomT = now - bloomStarted;
  mouseParallax += (targetParallax - mouseParallax) * 0.045;
  // 渲染循环没修好时，花会失控地转；修好了才恢复从容的 36 秒一圈
  const spinPeriod = RULES.continuous ? 36.0 : 1.8;
  spinPhase = (spinPhase + delta * TAU / spinPeriod) % TAU;
  const angle = spinPhase + mouseParallax * 0.055;

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  drawBackground(elapsed);
  drawCodePanel(elapsed);
  drawSpaceBox(angle, elapsed);
  drawOutlines(angle, bloomT, elapsed);
  const bloomPercent = drawParticles(angle, bloomT, elapsed);
  drawClickSparks(delta);
  drawLabels(bloomPercent, elapsed);

  requestAnimationFrame(frame);
}

window.addEventListener("keydown", function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    if (typeof doRun === "function") doRun();
    e.preventDefault();
    return;
  }
  // 焦点在编辑器里时，键盘属于编辑器：空格、R 这些必须照常输入
  if (e.target === codeEl) return;
  if (e.key === " " || e.code === "Space") {
    setPalette(paletteIndex + 1);
    e.preventDefault();
  } else if (e.key === "r" || e.key === "R") {
    bloomStarted = performance.now() / 1000;
  } else if (e.key === "F11") {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    e.preventDefault();
  }
});

window.addEventListener("mousemove", function (e) {
  targetParallax = (e.clientX / Math.max(1, width) - 0.5) * 2.0;
});

let lastTapAt = 0;
canvas.addEventListener("pointerdown", function (e) {
  const now = performance.now();
  if (now - lastTapAt < 320) {          // 双击：换一套配色
    lastTapAt = 0;
    setPalette(paletteIndex + 1);
    return;
  }
  lastTapAt = now;
  burst(e.clientX, e.clientY);          // 轻点：撒花
});

/* ==========================================================================
   修 bug 闯关：编辑器 / 测试 / 通关
   ========================================================================== */

const workEl = document.getElementById("work");
const els = {
  code: document.getElementById("code"),
  hlc: document.getElementById("hlc"),
  hl: document.getElementById("hl"),
  gutter: document.getElementById("gutter"),
  out: document.getElementById("out"),
  run: document.getElementById("run"),
  reset: document.getElementById("reset"),
  status: document.getElementById("status")
};
const codeEl = els.code;

const LS_SRC = "eternal-rose:src";
const LS_SOLVED = "eternal-rose:solved";

function store(key, value) {
  try { localStorage.setItem(key, value); } catch (err) { /* 无痕模式，忽略 */ }
}
function unstore(key) {
  try { localStorage.removeItem(key); } catch (err) { /* 忽略 */ }
}
function recall(key) {
  try { return localStorage.getItem(key); } catch (err) { return null; }
}

/* ── 编辑器：高亮 / 行号 / 滚动同步 ─────────────────────────── */

/* KEYWORD_RE 的 $ 不带 m 标志（引擎是逐行喂给它的）。编辑器一次要
   处理整份源码，所以复制一份加上 m，否则只有最后一行会认出行注释。 */
const HL_RE = new RegExp(KEYWORD_RE.source, "gm");

function esc(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlight(src) {
  let out = "";
  let pos = 0;
  let m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(src)) !== null) {
    if (m.index > pos) out += esc(src.slice(pos, m.index));
    let cls = "tk-p";
    if (m[1]) cls = "tk-c";
    else if (m[2]) cls = "tk-s";
    else if (m[3]) cls = "tk-t";
    else if (m[4]) cls = "tk-v";
    else if (m[5]) cls = "tk-k";
    else if (m[6]) cls = "tk-n";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    pos = m.index + m[0].length;
    if (m[0].length === 0) HL_RE.lastIndex++;
  }
  return out + esc(src.slice(pos));
}

function syncScroll() {
  els.gutter.scrollTop = codeEl.scrollTop;
  els.hl.scrollTop = codeEl.scrollTop;
  els.hl.scrollLeft = codeEl.scrollLeft;
}

function refreshEditor() {
  const src = codeEl.value;
  els.hlc.innerHTML = highlight(src) + "\n";
  const lineCount = src.split("\n").length;
  let nums = "";
  for (let i = 1; i <= lineCount; i++) nums += i + "\n";
  els.gutter.textContent = nums;
  syncScroll();
}

/* ── 沙箱：真的执行他写的代码 ───────────────────────────────── */

let rafCalls = 0;
let rafScheduled = null;

const engineStub = {
  bouquet: { render: function () {} },
  ctx: {},
  performance: performance,
  makeRng: makeRng,
  requestAnimationFrame: function (cb) {
    rafCalls++;
    if (typeof cb !== "function") {
      throw new TypeError("requestAnimationFrame 需要一个函数，收到 " + typeof cb);
    }
    rafScheduled = cb;
    return 1;
  }
};

function compileModule(src) {
  const body = '"use strict";\n' +
    "const { bouquet, ctx, requestAnimationFrame, performance, makeRng } = engine;\n" +
    src +
    "\n;return {" +
    ' petalCountOf: typeof petalCountOf === "function" ? petalCountOf : null,' +
    ' makeRoseCenters: typeof makeRoseCenters === "function" ? makeRoseCenters : null,' +
    ' buildFoliage: typeof buildFoliage === "function" ? buildFoliage : null,' +
    ' buildBouquet: typeof buildBouquet === "function" ? buildBouquet : null,' +
    ' bloomForever: typeof bloomForever === "function" ? bloomForever : null };';
  const api = new Function("engine", body)(engineStub);
  if (!api.petalCountOf) throw new Error("找不到 petalCountOf()");
  if (!api.makeRoseCenters) throw new Error("找不到 makeRoseCenters()");
  if (!api.buildFoliage) throw new Error("找不到 buildFoliage()");
  if (!api.buildBouquet) throw new Error("找不到 buildBouquet()");
  if (!api.bloomForever) throw new Error("找不到 bloomForever()");
  return api;
}

function describeError(err) {
  if (!err) return "未知错误";
  const name = err.name || "Error";
  let msg = String(err.message === undefined ? err : err.message);
  msg = msg.replace(/^<anonymous>:\s*/, "");
  if (msg.length > 140) msg = msg.slice(0, 140) + "…";
  return name + ": " + msg;
}

function validCenter(c) {
  return Array.isArray(c) && c.length >= 4 &&
    Number.isFinite(c[0]) && Number.isFinite(c[1]) &&
    Number.isFinite(c[2]) && Number.isFinite(c[3]);
}

/* ── 测试 ──────────────────────────────────────────────────── */

const EXPECTED_PETAL_COUNTS = [3, 5, 7, 9, 11];

function makeMockBuilder() {
  const calls = { addStem: [], addRose: [], addLeaves: [], addFoliageCloud: [], addBabyBreath: [], addWrapper: 0 };
  return {
    calls: calls,
    addStem: function (c, i) { calls.addStem.push([c, i]); },
    addRose: function (c, r, i) { calls.addRose.push([c, r, i]); },
    addLeaves: function (n) { calls.addLeaves.push(n); },
    addFoliageCloud: function (n) { calls.addFoliageCloud.push(n); },
    addBabyBreath: function (n) { calls.addBabyBreath.push(n); },
    addWrapper: function () { calls.addWrapper++; }
  };
}

function sumCalls(list) {
  let total = 0;
  for (let i = 0; i < list.length; i++) total += Number(list[i]) || 0;
  return total;
}

function runTests(api) {
  const results = [];
  let passed = 0, failed = 0;
  function record(ok, name, msg, skip) {
    results.push({ ok: ok, name: name, msg: msg, skip: !!skip });
    if (skip) return;
    if (ok) passed++; else failed++;
  }

  // ── 先用一个 mock builder 把整束花"搭"一遍，看每一步发生了什么 ──
  const mock = makeMockBuilder();
  let buildErr = null;
  try {
    api.buildBouquet(mock);
  } catch (err) {
    buildErr = err;
  }

  // 1. 衬底：叶子、满天星、包装纸
  if (buildErr) {
    record(false, "buildBouquet()", describeError(buildErr));
  } else {
    const leaves = sumCalls(mock.calls.addLeaves);
    const cloud = sumCalls(mock.calls.addFoliageCloud);
    const ok = leaves > 0 && cloud >= 1000;
    record(ok, "衬底 buildFoliage", ok ?
      "叶子、满天星、包装纸都在" :
      "衬底是空的（叶子 / 满天星 / 包装纸一个都没画）");
  }

  // 2. 花茎：每一根都得拿到自己的 index
  if (buildErr) {
    record(false, "花茎 addStem", "跳过（buildBouquet 没能跑起来）", true);
  } else {
    let badStem = -1;
    for (let i = 0; i < mock.calls.addStem.length; i++) {
      const idx = mock.calls.addStem[i][1];
      if (typeof idx !== "number" || !isFinite(idx)) { badStem = i; break; }
    }
    const ok = mock.calls.addStem.length > 0 && badStem === -1;
    record(ok, "花茎 addStem", ok ?
      (mock.calls.addStem.length + " 根花茎，各自站位") :
      (badStem >= 0 ? "第 " + badStem + " 根花茎没拿到 index（成了 NaN）" : "一根花茎都没有"));
  }

  // 3. 花心：数量（直接调 makeRoseCenters）
  let centers = null;
  let centersErr = null;
  try {
    centers = api.makeRoseCenters(26, makeRng(20260812));
  } catch (err) {
    centersErr = err;
  }
  const list = Array.isArray(centers) ? centers : null;
  let centersOK = false;
  if (centersErr) {
    record(false, "花心 makeRoseCenters", describeError(centersErr));
  } else if (!list || list.length !== 26) {
    record(false, "花心 makeRoseCenters", "返回 " + (list ? list.length : 0) + " 个花心（期望 26 个）");
  } else if (!list.every(validCenter)) {
    record(false, "花心 makeRoseCenters", "坐标里有 NaN / Infinity");
  } else {
    record(true, "花心 makeRoseCenters", "26 个花心，坐标全部有效");
    centersOK = true;
  }

  // 4. 花头大小
  if (!centersOK) {
    record(false, "花头大小", "跳过（没有可用的花心）", true);
  } else {
    let minR = Infinity, maxR = 0;
    for (let i = 0; i < list.length; i++) {
      if (list[i][3] < minR) minR = list[i][3];
      if (list[i][3] > maxR) maxR = list[i][3];
    }
    const ok = minR > 50;
    record(ok, "花头大小", ok ?
      ("半径 " + minR.toFixed(0) + " – " + maxR.toFixed(0)) :
      ("花头半径只有 " + maxR.toFixed(1) + "，缩成了小点"));
  }

  // 5. 每层花瓣数
  let counts = [];
  try {
    for (let layer = 0; layer < 5; layer++) counts.push(api.petalCountOf(layer));
  } catch (err) { counts = []; }
  let countsOk = counts.length === 5;
  if (countsOk) {
    for (let i = 0; i < 5; i++) if (counts[i] !== EXPECTED_PETAL_COUNTS[i]) countsOk = false;
  }
  if (countsOk) {
    record(true, "花瓣 petalCountOf", "[" + counts.join(", ") + "]");
  } else if (counts.length === 0) {
    record(false, "花瓣 petalCountOf", "调用时抛错");
  } else {
    let firstBad = 0;
    for (let i = 0; i < counts.length; i++) {
      if (counts[i] !== EXPECTED_PETAL_COUNTS[i]) { firstBad = i; break; }
    }
    const actual = counts[firstBad];
    const shown = actual === undefined ? "undefined" : String(actual);
    record(false, "花瓣 petalCountOf", "第 " + firstBad + " 层返回 " + shown + "（期望 " + EXPECTED_PETAL_COUNTS[firstBad] + "）");
  }

  // 6. 螺旋排列（行为测试：花心不能挤在一条直线上）
  if (!centersOK) {
    record(false, "螺旋排列", "跳过（没有可用的花心）", true);
  } else {
    const dirs = {};
    for (let i = 0; i < list.length; i++) {
      const deg = Math.atan2(list[i][2], list[i][0]) * 180 / Math.PI;
      dirs[Math.round(deg)] = true;
    }
    const spread = Object.keys(dirs).length;
    record(spread >= 20, "螺旋排列", spread >= 20 ?
      (list.length + " 个花心分布在 " + spread + " 个方向") :
      (list.length + " 个花心只有 " + spread + " 个方向，排成了一条直线"));
  }

  // 7. 一直开下去
  let loopError = null;
  rafCalls = 0;
  rafScheduled = null;
  try {
    api.bloomForever();
  } catch (err) {
    loopError = err;
  }
  const continuous = !loopError && typeof rafScheduled === "function";
  if (loopError) {
    record(false, "bloomForever()", describeError(loopError));
  } else if (typeof rafScheduled !== "function") {
    record(false, "bloomForever()", "没有把下一帧交给 requestAnimationFrame");
  } else {
    record(true, "bloomForever()", "每帧只排一次队");
  }

  return { results: results, passed: passed, failed: failed, continuous: continuous };
}

/* ── 控制台 ────────────────────────────────────────────────── */

function padName(name) {
  let s = name;
  while (s.length < 19) s += " ";
  return s;
}

function renderConsole(outcome, compileError) {
  const lines = [];
  if (compileError) {
    lines.push('<span class="r-warn"><b>✗ 编译失败</b></span>');
    lines.push('<span class="r-bad">' + esc(describeError(compileError)) + "</span>");
    lines.push("");
    lines.push('<span class="r-dim">玫瑰停在上一帧，先让代码能编译。</span>');
    els.out.innerHTML = lines.join("\n");
    return;
  }
  for (const r of outcome.results) {
    if (r.skip) {
      lines.push('<span class="r-dim">– ' + esc(padName(r.name)) + esc(r.msg) + "</span>");
    } else if (r.ok) {
      lines.push('<span class="r-ok">✓ ' + esc(padName(r.name)) + "</span>" +
                 '<span class="r-dim">' + esc(r.msg) + "</span>");
    } else {
      lines.push('<span class="r-bad">✗ ' + esc(padName(r.name)) + "</span>" +
                 '<span class="r-bad">' + esc(r.msg) + "</span>");
    }
  }
  lines.push("");
  lines.push(outcome.failed === 0
    ? '<span class="r-ok"><b>' + outcome.passed + " passed · 0 failed</b></span>"
    : '<span class="r-bad"><b>' + outcome.passed + " passed · " + outcome.failed + " failed</b></span>");
  if (outcome.failed === 0) {
    lines.push('<span class="r-ok">' + esc(CONFIG.successLine) + "</span>");
    if (CONFIG.successExtra) lines.push('<span class="r-ok">' + esc(CONFIG.successExtra) + "</span>");
  }
  els.out.innerHTML = lines.join("\n");
}

function setStatus(failed) {
  if (failed === null) {
    els.status.textContent = "编译失败";
    els.status.className = "";
  } else if (failed === 0) {
    els.status.textContent = "0 个问题 · 玫瑰盛开";
    els.status.className = "ok";
  } else {
    els.status.textContent = failed + " 个问题";
    els.status.className = "";
  }
}

/* ── 几何重建：把玩家的值喂进渲染引擎 ────────────────────────── */

function rebuild() {
  geometry = buildGeometry();
  data = geometry.data;
  count = geometry.count;
  outline = geometry.outlines;
  colors = new Float32Array(count * 3);
  outX = null; outY = null; outD = null;
  setPalette(paletteIndex);
}

/* ── 运行 ──────────────────────────────────────────────────── */

function applySource(src) {
  let api = null;
  let compileError = null;
  try {
    api = compileModule(src);
  } catch (err) {
    compileError = err;
  }
  if (!api) {
    renderConsole(null, compileError);
    setStatus(null);
    return false;
  }
  const outcome = runTests(api);
  RULES.petalCountOf = api.petalCountOf;
  RULES.makeRoseCenters = api.makeRoseCenters;
  RULES.buildBouquet = api.buildBouquet;
  RULES.continuous = outcome.continuous;
  rebuild();
  renderConsole(outcome, null);
  setStatus(outcome.failed);
  return outcome.failed === 0;
}

function doRun() {
  if (won) {                                   // 通关后，这个按钮变成「重新盛放」
    bloomStarted = performance.now() / 1000;
    return;
  }
  codeEl.blur();                               // 收起键盘，露出完整的玫瑰
  store(LS_SRC, codeEl.value);
  if (applySource(codeEl.value)) win();
}

/* ── 通关：界面不动，编辑器原地锁定，玫瑰在原地盛开 ───────────── */

function win() {
  if (won) return;
  won = true;
  document.body.classList.add("won");
  codeEl.readOnly = true;
  els.run.textContent = "重新盛放";
  setStatus(0);
  bloomStarted = performance.now() / 1000;      // 把"开花"在原地重播一遍
  const cx = left + sceneW * 0.52, cy = height * 0.59;
  burst(cx, cy);
  burst(cx, cy);
  store(LS_SOLVED, "1");
}

function unlock() {
  won = false;
  document.body.classList.remove("won");
  codeEl.readOnly = false;
  els.run.textContent = "运行 ▶";
}

/* ── iOS 视口：键盘弹起时不要挡住编辑器 ──────────────────────── */

function syncViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  const root = document.documentElement.style;
  root.setProperty("--vh", Math.round(h) + "px");
  root.setProperty("--vvtop", Math.round(top) + "px");
  document.body.classList.toggle("kb", h < 560);
}

function keepAwake() {
  if (!("wakeLock" in navigator)) return;
  try {
    navigator.wakeLock.request("screen").catch(function () {});
  } catch (err) { /* 不支持就算了 */ }
}

/* ── 事件 ──────────────────────────────────────────────────── */

codeEl.addEventListener("input", function () {
  refreshEditor();
  store(LS_SRC, codeEl.value);
});
codeEl.addEventListener("scroll", syncScroll);
codeEl.addEventListener("focus", function () {
  syncViewport();
  setTimeout(syncViewport, 320);
});
window.visualViewport && window.visualViewport.addEventListener("resize", syncViewport);
window.visualViewport && window.visualViewport.addEventListener("scroll", syncViewport);
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", function () {
  setTimeout(syncViewport, 260);
  setTimeout(resize, 300);
});
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") keepAwake();
});

els.run.addEventListener("click", doRun);

let resetArmed = false;
let resetTimer = 0;
function disarmReset() {
  resetArmed = false;
  els.reset.classList.remove("armed");
  els.reset.textContent = "重置";
}
els.reset.addEventListener("click", function () {
  if (!resetArmed) {
    resetArmed = true;
    els.reset.classList.add("armed");
    els.reset.textContent = "再点一次";
    clearTimeout(resetTimer);
    resetTimer = setTimeout(disarmReset, 4000);
    return;
  }
  clearTimeout(resetTimer);
  disarmReset();
  unlock();
  codeEl.value = ROSE_MODULE_BUGGY;
  unstore(LS_SRC);
  unstore(LS_SOLVED);
  bloomStarted = performance.now() / 1000 - 30;
  refreshEditor();
  applySource(codeEl.value);
  codeEl.scrollTop = 0;
  codeEl.scrollLeft = 0;
  syncScroll();
});

/* ── 启动 ──────────────────────────────────────────────────── */

(function boot() {
  const params = new URLSearchParams(location.search);
  if (params.has("fresh")) { unstore(LS_SRC); unstore(LS_SOLVED); }
  const savedSrc = params.has("fresh") ? null : recall(LS_SRC);
  const savedSolved = !params.has("fresh") && !params.has("edit") && recall(LS_SOLVED) === "1";

  codeEl.value = savedSrc || ROSE_MODULE_BUGGY;
  refreshEditor();
  syncViewport();
  keepAwake();
  resize();                                       // 摆正玫瑰和左栏
  bloomStarted = performance.now() / 1000 - 30;   // 编辑阶段：以"长成了"的样子示人

  if (savedSolved) {
    // 已经修好过：直接回到那朵完整的花
    RULES.petalCountOf = defaultPetalCountOf;
    RULES.makeRoseCenters = defaultMakeRoseCenters;
    RULES.buildBouquet = defaultBuildBouquet;
    RULES.continuous = true;
    rebuild();
    win();
  } else {
    applySource(codeEl.value);   // 先跑一次，让他一上来就看到几个红叉
  }
})();

window.addEventListener("resize", resize);

resize();
setPalette(0);
requestAnimationFrame(frame);
</script>
